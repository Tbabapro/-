
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parlak Yazı</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #182b55 0%, #080d20 55%, #03050c 100%);
    font-family: Arial, sans-serif;
}

.glow {
    width: 100%;
    padding: 30px;
    text-align: center;
}

#mainText {
    font-size: clamp(40px, 10vw, 120px);
    font-weight: 900;
    letter-spacing: 3px;
    line-height: 1.15;
    color: #ffffff;

    text-shadow:
        0 0 10px #ffffff,
        0 0 25px #00c8ff,
        0 0 50px #008cff,
        0 0 90px #005eff;

    animation: shine 3s ease-in-out infinite alternate;
    overflow-wrap: anywhere;
}

@keyframes shine {
    from {
        text-shadow:
            0 0 10px #ffffff,
            0 0 25px #00c8ff,
            0 0 50px #008cff;
    }

    to {
        text-shadow:
            0 0 15px #ffffff,
            0 0 35px #00eaff,
            0 0 75px #008cff,
            0 0 110px #005eff;
    }
}

/* Telefon ve küçük ekranlar */
@media (max-width: 600px) {
    #mainText {
        letter-spacing: 1px;
    }

    .glow {
        padding: 18px;
    }
}
</style>
</head>

<body>

<div class="glow">
    <h1 id="mainText">SENİN YAZIN BURADA</h1>
</div>

</body>
</html>

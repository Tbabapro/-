
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parlak Yazı</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #142b4b, #050811 75%);
    overflow: hidden;
    font-family: Arial, sans-serif;
}

h1 {
    color: white;
    font-size: clamp(40px, 10vw, 120px);
    text-align: center;
    font-weight: 900;
    text-shadow:
        0 0 10px #00ccff,
        0 0 25px #00ccff,
        0 0 50px #0088ff,
        0 0 90px #0055ff;
    animation: glow 2s infinite alternate;
    padding: 20px;
    overflow-wrap: anywhere;
}

@keyframes glow {
    from {
        text-shadow:
            0 0 10px #00ccff,
            0 0 25px #0088ff,
            0 0 45px #0055ff;
    }
    to {
        text-shadow:
            0 0 20px #00ffff,
            0 0 50px #0088ff,
            0 0 100px #0055ff;
    }
}
</style>
</head>

<body>

<!-- SADECE BURADAKİ YAZIYI DEĞİŞTİR -->
<h1 id="mainText"><h1>

</body>
</html>
